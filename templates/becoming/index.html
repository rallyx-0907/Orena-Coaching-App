  <script>
    (() => {
      try {
        const saved = localStorage.getItem('becoming.theme.v1');
        const theme = saved === 'dark' || saved === 'light' ? saved : 'light';
        const palette = localStorage.getItem('becoming.palette.v1') || 'editorial';
        const uiLocale = localStorage.getItem('becoming.support-language.v1') || 'vi';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = palette;
        document.documentElement.lang = uiLocale === 'zh' ? 'zh-Hans' : uiLocale;
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.palette = 'editorial';
      }
    })();
  </script>

             that number exists, so the rail never shows a placebo figure. -->

          <svg class="o-streak-flame" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.4c2.7 3.1 4 5.6 4 7.5 0 1.3-.6 2.4-1.8 3 .5-1.6.2-3.1-1-4.3.2 2.5-.8 4.1-3.1 5-1.6.7-2.5 1.9-2.5 3.6 0 2.5 2.1 4.5 4.8 4.5 3.3 0 5.8-2.5 5.8-6 0-4.3-2.1-8.7-6.2-13.3Z"/></svg>

          </span>
        </div>

        <!-- Plan card. The reference shows "Pro Plan / Renews May 12, 2025";
             there is no billing backend yet, so this shows the learner's real

      <!-- The reference header carries only the theme toggle and the avatar,
           and puts language under Preferences. The interface language is worth
           reaching quickly all the same, so it lives one click away here
           rather than taking a permanent slot in the header. -->
      <label class="account-menu-field" for="languageSelect">
        <span class="utility-label" data-learning-language-label>Interface language</span>
        <select id="languageSelect" class="language-select" aria-label="Interface language">
          <option value="">Loading…</option>
        </select>
      </label>

      <button type="button" data-account-action="switch" role="menuitem">Switch account</button>
      <button type="button" data-account-action="logout" role="menuitem">Sign out</button>
    </div>
