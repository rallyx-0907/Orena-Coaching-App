name: ai-writing-coach

services:
  writing-coach:
    build: .
    image: ai-writing-coach:local
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      WRITING_DB: /data/writing.db
      ALLOW_FALLBACK: ${ALLOW_FALLBACK:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_ENV: ${APP_ENV:-development}
      APP_BIND_HOST: ${APP_BIND_HOST:-0.0.0.0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      AUTH_DB: /data/auth.db
      USER_DATA_ROOT: /data/users
      PLATFORM_DB: /data/platform.db
      PRODUCT_DB: /data/product.db
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-postgresql}
      POSTGRES_RUNTIME_URL: ${POSTGRES_RUNTIME_URL:-postgresql+psycopg://becoming:becoming-local-dev@postgres:5432/becoming}
      POSTGRES_SHADOW_URL: ${POSTGRES_SHADOW_URL:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODELS: ${DEEPSEEK_MODELS:-deepseek-v4-flash,deepseek-v4-pro}
      CLOUD_AI_TIMEOUT: ${CLOUD_AI_TIMEOUT:-180}
      MEDIA_TRANSCRIPT_FALLBACK: ${MEDIA_TRANSCRIPT_FALLBACK:-none}
      LOCAL_TRANSLATION_URL: ${LOCAL_TRANSLATION_URL:-http://local-translator:8090}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      SUPADATA_REQUEST_TIMEOUT_SECONDS: ${SUPADATA_REQUEST_TIMEOUT_SECONDS:-20}
      SUPADATA_MAX_WAIT_SECONDS: ${SUPADATA_MAX_WAIT_SECONDS:-150}
      SUPADATA_POLL_INTERVAL_SECONDS: ${SUPADATA_POLL_INTERVAL_SECONDS:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODELS: ${GROQ_MODELS:-}
      GROQ_TRANSLATION_MODEL: ${GROQ_TRANSLATION_MODEL:-openai/gpt-oss-120b}
      MEDIA_TRANSLATION_PROVIDER: ${MEDIA_TRANSLATION_PROVIDER:-}
      GROQ_ASR_MODEL: ${GROQ_ASR_MODEL:-whisper-large-v3-turbo}
      GROQ_ASR_TIMEOUT_SECONDS: ${GROQ_ASR_TIMEOUT_SECONDS:-120}
      GROQ_ASR_MAX_BYTES: ${GROQ_ASR_MAX_BYTES:-25165824}
      PRONUNCIATION_PROVIDER: ${PRONUNCIATION_PROVIDER:-demo}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_PRONUNCIATION_EN_LOCALE: ${AZURE_PRONUNCIATION_EN_LOCALE:-en-US}
      AZURE_PRONUNCIATION_ZH_LOCALE: ${AZURE_PRONUNCIATION_ZH_LOCALE:-zh-CN}
      AZURE_PRONUNCIATION_ENABLE_PROSODY: ${AZURE_PRONUNCIATION_ENABLE_PROSODY:-false}
      AZURE_PRONUNCIATION_TIMEOUT_SECONDS: ${AZURE_PRONUNCIATION_TIMEOUT_SECONDS:-30}
      AZURE_PRONUNCIATION_MAX_BYTES: ${AZURE_PRONUNCIATION_MAX_BYTES:-8388608}
      AZURE_PRONUNCIATION_MAX_REFERENCE_CHARS: ${AZURE_PRONUNCIATION_MAX_REFERENCE_CHARS:-1200}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - writing_data:/data
      - ./app.py:/app/app.py:ro
      - ./auth_support.py:/app/auth_support.py:ro
      - ./grammar_course.py:/app/grammar_course.py:ro
      - ./writing_coach:/app/writing_coach:ro
      - ./VERSION:/app/VERSION:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  writing-coach-tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        BASE_IMAGE: ai-writing-coach:local
    image: ai-writing-coach-tests:local
    environment:
      APP_ENV: development
      PERSISTENCE_BACKEND: sqlite
    command:
      - python
      - -m
      - pytest
      - -q
      - -p
      - no:cacheprovider
      - tests/test_r17_admin_routes.py
      - tests/test_reference_data_cache.py
      - tests/test_session_bootstrap.py
      - tests/test_media_status_compact.py

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-becoming}
      POSTGRES_USER: ${POSTGRES_USER:-becoming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-becoming-local-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-becoming} -d $${POSTGRES_DB:-becoming}"]
      interval: 5s
      timeout: 3s
      retries: 20

  local-translator:
    build: ./services/local_translation
    image: ai-writing-coach-local-translation:local
    restart: unless-stopped
    environment:
      HF_HOME: /models
      TRANSFORMERS_OFFLINE: "1"
      MAX_LOADED_TRANSLATION_MODELS: ${MAX_LOADED_TRANSLATION_MODELS:-2}
    volumes:
      - translation_models:/models

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - writing-coach

volumes:
  writing_data:
    name: ai-writing-coach-data
  postgres_data:
    name: ai-writing-coach-postgres-data
  translation_models:
    name: ai-writing-coach-translation-models
