name: Grammar Header Cache Key GREEN
on:
  push:
    branches:
      - feature/grammar-lab-pipeline
    paths:
      - '.github/workflows/header-cache-key-red.yml'
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/grammar-lab-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply production patch and permanent tests
        run: python scripts/_tmp_patch_header_cache_key.py
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_zh_header_metadata.py -q
      - name: Generation regressions
        run: python -m pytest grammar_lab/tests/test_generate.py grammar_lab/tests/test_validate_rules.py -q
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit production patch and remove temporary files
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git rm .github/workflows/header-cache-key-red.yml scripts/_tmp_patch_header_cache_key.py
          git add grammar_lab/pipeline/generate.py grammar_lab/tests/test_zh_header_metadata.py
          git commit -m "fix(grammar): preserve cache key while normalizing zh title output"
          git push origin HEAD:feature/grammar-lab-pipeline
