name: Paid Cache Guard RED
on:
  push:
    paths:
      - '.github/workflows/paid-cache-guard-red.yml'
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm regression is red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_completion_agent_cache_sweep.py -q
          status=$?
          set -e
          test "$status" -ne 0
