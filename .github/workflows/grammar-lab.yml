name: Grammar Lab CI

on:
  push:
    branches:
      - feature/grammar-lab-pipeline
    paths:
      - "grammar_lab/**"
      - "docs/grammar_lab/**"
      - ".github/workflows/grammar-lab.yml"
  pull_request:
    paths:
      - "grammar_lab/**"
      - "docs/grammar_lab/**"
      - ".github/workflows/grammar-lab.yml"

jobs:
  grammar-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upload grammar corpus snapshot for bounded review
        uses: actions/upload-artifact@v4
        with:
          name: grammar-corpus-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            grammar_lab/content/
            grammar_lab/inventory/catalog_en.yaml
            grammar_lab/inventory/catalog_zh.yaml
            grammar_lab/inventory/seeds_en.yaml
            grammar_lab/inventory/seeds_zh.yaml
            grammar_lab/inventory/en.yaml
            grammar_lab/inventory/zh.yaml
      - run: python -m pip install -e "grammar_lab[dev]"
      - run: python -m grammar_lab.pipeline.cli sync-metadata
      - run: python -m pytest grammar_lab/tests
      - run: python -m grammar_lab.pipeline.cli import-canonical --check
      - run: python -m grammar_lab.pipeline.cli sync-metadata --check
      - run: python -m grammar_lab.pipeline.cli seed-audit --lang all
      - run: python -m grammar_lab.pipeline.cli corpus-plan --lang all
