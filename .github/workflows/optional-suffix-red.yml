name: Grammar Optional Suffix RED

on:
  push:
    paths:
      - '.github/workflows/optional-suffix-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm optional-suffix regression is red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_optional_suffix_bindings.py -q
          status=$?
          set -e
          test "$status" -ne 0
