name: Grammar export production fix

on:
  push:
    branches:
      - codex/grammar-export-production-fix
    paths:
      - ".github/workflows/grammar-export-production-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/grammar-export-production-fix
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"

      - name: Fix reviewed seed metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml

          seed_path = Path('grammar_lab/inventory/seeds_zh.yaml')
          rows = yaml.safe_load(seed_path.read_text(encoding='utf-8')) or []
          replacements = {}
          for row in rows:
              point_id = row['id']
              seed_title = str(row.get('native_title', ''))
              content_path = Path('grammar_lab/content/zh') / f'{point_id}.json'
              if not content_path.exists():
                  continue
              point = json.loads(content_path.read_text(encoding='utf-8'))
              content_title = str((point.get('header') or {}).get('native_title', ''))
              # Existing content already passes the deterministic zh validator.
              # Only repair stale seed titles whose ASCII whitespace would be
              # re-applied during export and invalidate that approved content.
              if re.search(r'\s', seed_title) and seed_title != content_title and not re.search(r'\s', content_title):
                  replacements[point_id] = content_title

          if not replacements:
              raise SystemExit('expected at least one stale zh seed title')

          lines = seed_path.read_text(encoding='utf-8').splitlines()
          current_id = None
          changed = []
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith('- id: '):
                  current_id = stripped[len('- id: '):].strip().strip('"\'')
              elif current_id in replacements and stripped.startswith('native_title:'):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + 'native_title: ' + json.dumps(replacements[current_id], ensure_ascii=False)
                  changed.append(current_id)
                  current_id = None

          missing = sorted(set(replacements) - set(changed))
          if missing:
              raise SystemExit(f'could not rewrite native_title for: {missing}')
          seed_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'synced {len(changed)} stale zh seed title(s):')
          for point_id in changed:
              print(f'  {point_id}')
          PY
          python -m grammar_lab.pipeline.cli import-canonical --lang zh

      - name: Validate corpus
        run: |
          python -m grammar_lab.pipeline.cli validate --lang en
          python -m grammar_lab.pipeline.cli validate --lang zh
          python -m grammar_lab.pipeline.cli coverage --lang en
          python -m grammar_lab.pipeline.cli coverage --lang zh

      - name: Smoke export full-language production packages
        shell: bash
        run: |
          set -euo pipefail
          EN_IDS=$(python - <<'PY'
          from grammar_lab.pipeline.seed import load_catalog
          from grammar_lab.pipeline.validate import LAB_ROOT
          print(','.join(r['id'] for r in load_catalog('en', LAB_ROOT)))
          PY
          )
          ZH_IDS=$(python - <<'PY'
          from grammar_lab.pipeline.seed import load_catalog
          from grammar_lab.pipeline.validate import LAB_ROOT
          print(','.join(r['id'] for r in load_catalog('zh', LAB_ROOT)))
          PY
          )
          python -m grammar_lab.pipeline.cli export-package --lang en --ids "$EN_IDS" --out /tmp/grammar-en --set-version smoke.en --allow-dirty
          python -m grammar_lab.pipeline.cli validate-package /tmp/grammar-en
          python -m grammar_lab.pipeline.cli export-package --lang zh --ids "$ZH_IDS" --out /tmp/grammar-zh --set-version smoke.zh --allow-dirty
          python -m grammar_lab.pipeline.cli validate-package /tmp/grammar-zh

      - name: Commit source metadata fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar_lab/inventory/seeds_zh.yaml grammar_lab/inventory/catalog_zh.yaml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "fix(grammar): sync validated zh titles into production catalogue"
          git push origin HEAD:codex/grammar-export-production-fix
