name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # validate_project_memory.py resolves
          # last_verified_application_commit with `git cat-file`. The default
          # shallow fetch has no older history, so the check would fail on a
          # commit that is present in the repository.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r requirements.txt pytest
      - run: python -m nltk.downloader -q averaged_perceptron_tagger_eng
      - run: python scripts/validate_project_memory.py
      - run: python scripts/validate_architecture.py
      - run: python scripts/test_orena_backbone.py
      - run: python scripts/test_orena_account_profile.py
      - run: python scripts/test_orena_runtime_schema.py
      - run: python scripts/test_orena_work_contract.py
      - run: python scripts/build_listening_dev_catalog.py --check
      - run: node --experimental-vm-modules scripts/validate_browser_esm_graph.mjs
      # The D-046 reset deleted the old Listening-mode/Shadowing-Studio gates
      # along with the product they guarded. These are their replacements at the
      # new product boundary: the encounter/practice-intent layer, the shared
      # capability primitives, and the media contracts that outlived the reset.
      - run: |
          node scripts/test_orena_primitives.mjs
          node scripts/test_orena_product.mjs
          node scripts/test_orena_foundation.mjs
          node scripts/test_orena_follow_clock.mjs
          node scripts/test_orena_word_follow.mjs
          node scripts/test_orena_close_look.mjs
          node scripts/test_orena_dictation_hints.mjs
          node scripts/test_orena_understanding.mjs
          node scripts/test_orena_writing_review.mjs
          node scripts/test_orena_voice_evidence.mjs
          node scripts/test_orena_reading.mjs
          node scripts/test_orena_free_voice.mjs
          node scripts/test_orena_voice_interaction.mjs
          node scripts/test_orena_spoken_coaching.mjs
          node scripts/test_orena_pure_listening.mjs
          node scripts/test_orena_grammar.mjs
          node scripts/test_orena_conversation.mjs
          node scripts/test_orena_learner_memory.mjs
          node scripts/test_orena_continuation.mjs
          node scripts/test_orena_brand_library.mjs
          node scripts/test_orena_workspace.mjs
          node scripts/test_orena_reading_library.mjs
          node scripts/test_orena_extension_patterns.mjs
          node scripts/test_transcript_display_units.mjs
          node scripts/test_transcript_playback.mjs
          node scripts/test_dictation_evaluator.mjs
          node scripts/test_audio_recorder.mjs
          node scripts/test_m3_pronunciation_contract.mjs
          node scripts/test_media_learning_quality.mjs
          node scripts/test_real_media_catalog_contract.mjs
          node scripts/test_media_status_compact_accessor.mjs
          node scripts/test_orena_reference.mjs
      - run: python -m pytest -q test_app.py tests
        env:
          PERSISTENCE_BACKEND: sqlite
      - run: docker build -t ai-writing-coach:test .
