name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the run in flight. Runs on main are never cancelled: every
# merge keeps its own complete verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull request changes anything but Markdown. A push to main is always "code", so every merge
  # gets the full verdict. The validators and the Node gates run for every change either way.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes: $code"

  # Project-memory and architecture validators, the contract scripts and the Listening catalog check. Always run.
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # validate_project_memory.py resolves
          # last_verified_application_commit with `git cat-file`. The default
          # shallow fetch has no older history, so the check would fail on a
          # commit that is present in the repository.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m nltk.downloader -q averaged_perceptron_tagger_eng
      - run: python scripts/validate_project_memory.py
      - run: python scripts/validate_architecture.py
      - run: python scripts/test_orena_backbone.py
      - run: python scripts/test_orena_account_profile.py
      - run: python scripts/test_orena_runtime_schema.py
      - run: python scripts/test_orena_work_contract.py
      - run: python scripts/test_orena_job_contract.py
      - run: python scripts/test_orena_account_backbone.py
      - run: python scripts/test_runtime_backup.py
      - run: python scripts/build_listening_dev_catalog.py --check

  # Browser ESM graph and the .mjs contract gates. Always run. The gates are listed in scripts/node_gates.txt (the
  # D-046 reset deleted the old Listening-mode/Shadowing-Studio gates along with the product they guarded; these are
  # their replacements at the new product boundary: the encounter/practice-intent layer, the shared capability
  # primitives, and the media contracts that outlived the reset). They are independent processes, so
  # scripts/run_node_gates.sh runs four at a time; a failing gate prints its own output and does not hide the others.
  node-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --experimental-vm-modules scripts/validate_browser_esm_graph.mjs
      - run: sh scripts/run_node_gates.sh

  # The whole Python suite, split across the runner's CPUs by pytest-xdist (whole files per worker). Each worker has
  # its own databases and temp directory (conftest.py). A push to main and any pull request that changes more than
  # Markdown run the complete suite. A Markdown-only pull request runs just the test files that mention docs/ or .md.
  pytest:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # tests/test_project_memory.py runs the project-memory validator, which resolves commits with `git cat-file`.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The media pipeline integration tests probe real files with ffprobe, as the
      # application image does (its Dockerfile installs ffmpeg); the runner needs it too.
      - name: Install ffmpeg (ffprobe) for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -n 1
      - run: pip install -r requirements.txt pytest pytest-xdist==3.8.0
      - run: python -m nltk.downloader -q averaged_perceptron_tagger_eng
      - name: Full suite
        if: needs.changes.outputs.code == 'true'
        run: python -m pytest -q -n auto --dist loadfile --durations=15 test_app.py tests
        env:
          PERSISTENCE_BACKEND: sqlite
      - name: Document-reading tests (Markdown-only change)
        if: needs.changes.outputs.code != 'true'
        run: |
          files=$(grep -rlE 'docs/|\.md' test_app.py tests --include='*.py')
          python -m pytest -q -n auto --dist loadfile $files
        env:
          PERSISTENCE_BACKEND: sqlite

  docker-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t ai-writing-coach:test .

  # The single required status check for main ("test" in the repository ruleset). It passes only if every job passed;
  # the one skip allowed is docker-build on a Markdown-only pull request, where the changes job says so.
  test:
    needs: [changes, python-gates, node-gates, pytest, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          PYTHON_GATES: ${{ needs.python-gates.result }}
          NODE_GATES: ${{ needs.node-gates.result }}
          PYTEST: ${{ needs.pytest.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
        run: |
          echo "changes=$CHANGES python-gates=$PYTHON_GATES node-gates=$NODE_GATES pytest=$PYTEST docker-build=$DOCKER_BUILD code=$CODE"
          for r in "$CHANGES" "$PYTHON_GATES" "$NODE_GATES" "$PYTEST"; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
          if [ "$DOCKER_BUILD" = "success" ]; then exit 0; fi
          if [ "$DOCKER_BUILD" = "skipped" ] && [ "$CODE" = "false" ]; then exit 0; fi
          echo "docker-build did not succeed"
          exit 1
