name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # validate_project_memory.py resolves
          # last_verified_application_commit with `git cat-file`. The default
          # shallow fetch has no older history, so the check would fail on a
          # commit that is present in the repository.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r requirements.txt pytest
      - run: python -m nltk.downloader -q averaged_perceptron_tagger_eng
      - run: python scripts/validate_project_memory.py
      - run: python scripts/validate_architecture.py
      - run: python scripts/build_listening_dev_catalog.py --check
      - run: node --experimental-vm-modules scripts/validate_browser_esm_graph.mjs
      - run: |
          node scripts/test_interactive_transcript_contract.mjs
          node scripts/test_listening_player_lifecycle_contract.mjs
          node scripts/test_listening_smart_follow_contract.mjs
          node scripts/test_listening_ui.mjs
          node scripts/test_transcript_display_units.mjs
          node scripts/test_transcript_playback.mjs
          node scripts/test_active_listening.mjs
          node scripts/test_shadowing_practice.mjs
          node scripts/test_media_learning_quality.mjs
          node scripts/test_real_media_catalog_contract.mjs
          node scripts/test_listening_discovery_contract.mjs
          node scripts/test_orena_home_h1.mjs
          node scripts/test_home_personalized_practice_flow.mjs
          node scripts/test_home_practice_outcome_shape.mjs
          node scripts/test_home_library_review_handoff.mjs
          node scripts/test_r12_next_practice_plan.mjs
          node scripts/test_r12_listening_habit_home.mjs
          node scripts/test_r12_listening_return.mjs
          node scripts/test_review_cue_locale.mjs
          node scripts/test_cross_skill_transfer_locale.mjs
      - run: python -m pytest -q test_app.py tests
        env:
          PERSISTENCE_BACKEND: sqlite
      - run: docker build -t ai-writing-coach:test .
