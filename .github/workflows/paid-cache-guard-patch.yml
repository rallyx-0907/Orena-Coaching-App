name: Paid Cache Guard Patch
on:
  push:
    paths:
      - '.github/workflows/paid-cache-guard-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply paid-cache guard
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/grammar_completion_agent.ps1')
          text = path.read_text(encoding='utf-8')

          anchor = '''function Get-ReadyPointIds {\n'''
          helper = '''function Test-CacheMiss {\n    param([string]$Text)\n    return $Text -match "cache-only mode:\\s+no cached completion"\n}\n\n'''
          assert 'function Test-CacheMiss' not in text
          assert anchor in text
          text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('if ($probe.Text -match "cache-only mode: no cached completion") {', 'if (Test-CacheMiss -Text $probe.Text) {', 1)

          old = '''            Write-Host ""\n            Write-Host "--- Codex rescue: $pointId ---"\n            $rescueExit = Invoke-Rescue -PointId $pointId\n'''
          new = '''            Write-Host ""\n            Write-Host "--- Verify cached paid candidate before rescue: $pointId ---"\n            $paidReplay = Invoke-Corpus -Language $language -PointId $pointId -CacheOnly\n\n            if (Test-Written -Text $paidReplay.Text -PointId $pointId) {\n                $processed++\n                continue\n            }\n\n            if (Test-CacheMiss -Text $paidReplay.Text) {\n                Write-Host "STOP: paid attempt returned error, but no cached paid candidate exists."\n                Write-Host "Codex rescue skipped because no cached paid candidate exists."\n                Write-Host "No additional paid candidate was requested."\n                exit 22\n            }\n\n            Write-Host ""\n            Write-Host "--- Codex rescue: $pointId ---"\n            $rescueExit = Invoke-Rescue -PointId $pointId\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_completion_agent_cache_sweep.py grammar_lab/tests/test_completion_agent_maxpoints.py -q
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/grammar_completion_agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add scripts/grammar_completion_agent.ps1
          git commit -m "fix(grammar): verify paid cache before rescue"
          git push origin HEAD:feature/grammar-lab-pipeline
# rerun after contract assertion update
