name: Grammar Learning Repair
on:
  push:
    branches:
      - feature/grammar-lab-pipeline
    paths:
      - 'grammar_lab/pipeline/generate.py'
      - 'grammar_lab/tests/test_generate.py'
      - 'grammar_lab/tests/test_learning_block_repair.py'
      - 'scripts/_tmp_patch_learning_repair.py'
      - 'scripts/_tmp_patch_learning_repair_tests.py'
      - '.github/workflows/grammar-learning-repair.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/grammar-lab-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply production patch
        run: python scripts/_tmp_patch_learning_repair.py
      - name: Align existing retry contract tests
        run: python scripts/_tmp_patch_learning_repair_tests.py
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_learning_block_repair.py -q
      - name: Generation regressions
        run: python -m pytest grammar_lab/tests/test_generate.py grammar_lab/tests/test_llm_client.py -q
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit production patch and remove temporary files
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git rm .github/workflows/grammar-learning-repair.yml scripts/_tmp_patch_learning_repair.py scripts/_tmp_patch_learning_repair_tests.py
          git add grammar_lab/pipeline/generate.py grammar_lab/tests/test_generate.py grammar_lab/tests/test_learning_block_repair.py
          git commit -m "fix(grammar): repair bounded learner blocks by class"
          git push origin HEAD:feature/grammar-lab-pipeline
