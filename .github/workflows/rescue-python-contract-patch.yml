name: Rescue Control Contract Patch

on:
  push:
    paths:
      - '.github/workflows/rescue-python-contract-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply futile-rescue stop patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/grammar_rescue_agent.ps1')
          text = path.read_text(encoding='utf-8')

          old = '''    $output | ForEach-Object { Write-Host $_ }\n    return [int]$exitCode\n}\n'''
          new = '''    $output | ForEach-Object { Write-Host $_ }\n    $text = ($output | Out-String)\n    return [pscustomobject]@{ ExitCode = $exitCode; Text = $text }\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    $agentExit = Invoke-CodexRepair -Id $PointId -Failure $replay.Text -RequestedModel $CodexModel -PythonExecutable $pythonExecutable\n    if ($agentExit -ne 0) {\n        Write-Error "Codex exited with code $agentExit."\n        exit 30\n    }\n\n'''
          new = '''    $agent = Invoke-CodexRepair -Id $PointId -Failure $replay.Text -RequestedModel $CodexModel -PythonExecutable $pythonExecutable\n    if ($agent.ExitCode -ne 0) {\n        Write-Error "Codex exited with code $($agent.ExitCode)."\n        exit 30\n    }\n    if ($agent.Text -match "(?m)^RESCUE_BLOCKED\\s*$") {\n        Write-Error "Codex reported RESCUE_BLOCKED. Stopping immediately; another identical Codex cycle would not add evidence."\n        exit 41\n    }\n    if ($agent.Text -match "(?m)^RESCUE_NO_CHANGE\\s*$") {\n        Write-Error "Codex reported RESCUE_NO_CHANGE. Stopping immediately; another identical Codex cycle would not add evidence."\n        exit 42\n    }\n    if ($agent.Text -notmatch "(?m)^RESCUE_PATCHED\\s*$") {\n        Write-Error "Codex did not return a recognized rescue terminal status."\n        exit 33\n    }\n\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Focused contract test
        run: python -m pytest grammar_lab/tests/test_rescue_agent_contract.py -q
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/grammar_rescue_agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add scripts/grammar_rescue_agent.ps1
          git commit -m "fix(grammar): stop futile repeated Codex rescues"
          git push origin HEAD:feature/grammar-lab-pipeline
