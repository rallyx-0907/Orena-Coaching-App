name: Rescue Python Contract RED

on:
  push:
    paths:
      - '.github/workflows/rescue-python-contract-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm rescue Python contract is red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_rescue_agent_contract.py -q
          status=$?
          set -e
          test "$status" -ne 0
