name: Grammar 595 Ship Approve

on:
  push:
    branches:
      - codex/grammar-595-review-local
    paths:
      - "grammar_lab/tools/ship_review_repairs.py"
      - ".github/workflows/grammar-595-ship-approve.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-validate-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/grammar-595-review-local
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"

      - name: Apply reviewed deterministic repairs
        run: python grammar_lab/tools/ship_review_repairs.py

      - name: Validate complete corpus before approval
        run: |
          python -m grammar_lab.pipeline.cli validate --lang en
          python -m grammar_lab.pipeline.cli validate --lang zh
          python -m grammar_lab.pipeline.cli coverage --lang en
          python -m grammar_lab.pipeline.cli coverage --lang zh

      - name: Approve all canonical levels
        shell: bash
        run: |
          set -euo pipefail
          for level in A1 A2 B1 B2 C1 C2; do
            python -m grammar_lab.pipeline.cli approve --lang en --level "$level" --reviewer "Thi" --note "Ship-level review complete; validators clean; known major ambiguities fixed"
          done
          for level in HSK1 HSK2 HSK3 HSK4 HSK5 HSK6 HSK7 HSK8 HSK9; do
            python -m grammar_lab.pipeline.cli approve --lang zh --level "$level" --reviewer "Thi" --note "Ship-level review complete; validators clean; known major ambiguities fixed"
          done

      - name: Verify approval gate
        run: |
          python -m grammar_lab.pipeline.cli coverage --lang en
          python -m grammar_lab.pipeline.cli coverage --lang zh
          python -m grammar_lab.pipeline.cli export-profile

      - name: Commit approved corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar_lab/content/en grammar_lab/content/zh
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "content(grammar): approve reviewed 595-point corpus"
          git push origin HEAD:codex/grammar-595-review-local
