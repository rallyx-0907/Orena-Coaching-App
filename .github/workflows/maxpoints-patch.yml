name: MaxPoints Patch

on:
  push:
    paths:
      - '.github/workflows/maxpoints-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply MaxPoints scope fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/grammar_completion_agent.ps1')
          text = path.read_text(encoding='utf-8')
          old = '''        $readyPointIds = @(Get-ReadyPointIds -Language $language)\n        if ($readyPointIds.Count -eq 0) {\n            Write-Host "$language has no ready points remaining."\n            break\n        }\n\n        Write-Host ""\n        Write-Host "--- Free cache sweep: $($readyPointIds.Count) ready point(s) ---"\n'''
          new = '''        $readyPointIds = @(Get-ReadyPointIds -Language $language)\n        if ($readyPointIds.Count -eq 0) {\n            Write-Host "$language has no ready points remaining."\n            break\n        }\n\n        if ($MaxPoints -gt 0) {\n            $remainingPointSlots = $MaxPoints - $processed\n            if ($remainingPointSlots -le 0) {\n                Write-Host "MaxPoints reached. Safe to resume with the same command."\n                Write-Host "Paid spend this run: USD $($spent.ToString('0.0000'))"\n                exit 0\n            }\n            $readyPointIds = @($readyPointIds | Select-Object -First $remainingPointSlots)\n        }\n\n        Write-Host ""\n        Write-Host "--- Free cache sweep: $($readyPointIds.Count) ready point(s) ---"\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_completion_agent_maxpoints.py -q
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/grammar_completion_agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add scripts/grammar_completion_agent.ps1
          git commit -m "fix(grammar): make MaxPoints cap cache sweep"
          git push origin HEAD:feature/grammar-lab-pipeline
