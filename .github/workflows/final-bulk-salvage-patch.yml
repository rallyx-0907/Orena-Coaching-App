name: Grammar Bulk Salvage Patch
on:
  push:
    branches:
      - feature/grammar-lab-pipeline
    paths:
      - '.github/workflows/final-bulk-salvage-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/grammar-lab-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Add regression and patch zh header normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('grammar_lab/pipeline/generate.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _header_metadata(existing: dict[str, Any], locales: list[str]) -> dict[str, Any]:
              """title/native_title/level: structural metadata, carried over, never generated. A point
              still on the first v0.4 shape keeps them in a top-level title instead of a header."""
              if "header" in existing:
                  header = existing["header"]
                  return {"title": header["title"], "native_title": header["native_title"], "level": dict(existing["level"])}
              title = existing["title"]
              native = title.get(existing["target_lang"]) or title.get("en") or title["vi"]
              return {
                  "title": {locale: title[locale] for locale in locales if locale in title} or {"vi": title["vi"]},
                  "native_title": native,
                  "level": dict(existing["level"]),
              }
          '''
          new = '''def _header_metadata(existing: dict[str, Any], locales: list[str]) -> dict[str, Any]:
              """title/native_title/level: structural metadata, carried over, never generated.

              Chinese learner-facing text is normalized here too.  The v0.4 generator already
              normalizes every model-authored target-language field through ``target_text``;
              leaving carried-over ``native_title`` untouched made deterministic validation reject
              otherwise-valid cached candidates whose canonical title used display spaces around
              symbols such as ``+``.
              """
              zh = existing.get("target_lang") == ZH_HANS
              if "header" in existing:
                  header = existing["header"]
                  native = target_text(str(header["native_title"]), zh)
                  return {"title": header["title"], "native_title": native, "level": dict(existing["level"])}
              title = existing["title"]
              native = title.get(existing["target_lang"]) or title.get("en") or title["vi"]
              native = target_text(str(native), zh)
              return {
                  "title": {locale: title[locale] for locale in locales if locale in title} or {"vi": title["vi"]},
                  "native_title": native,
                  "level": dict(existing["level"]),
              }
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('expected _header_metadata source block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('grammar_lab/tests/test_zh_header_metadata.py')
          test.write_text('''from grammar_lab.pipeline.generate import _header_metadata\nfrom grammar_lab.pipeline.validate import ZH_HANS, _ZH_SPACE\n\n\ndef test_zh_existing_header_native_title_matches_whitespace_contract() -> None:\n    existing = {\n        "target_lang": ZH_HANS,\n        "level": {"framework": "HSK", "value": "3"},\n        "header": {\n            "title": {"vi": "Liên động"},\n            "native_title": "连动句“去/来 + 动词”",\n        },\n    }\n    header = _header_metadata(existing, ["vi"])\n    assert header["native_title"] == "连动句“去/来+动词”"\n    assert _ZH_SPACE.search(header["native_title"]) is None\n\n\ndef test_zh_legacy_title_native_title_matches_whitespace_contract() -> None:\n    existing = {\n        "target_lang": ZH_HANS,\n        "level": {"framework": "HSK", "value": "4"},\n        "title": {"vi": "Cấu trúc 所", ZH_HANS: "“所 + V”结构入门"},\n    }\n    header = _header_metadata(existing, ["vi"])\n    assert header["native_title"] == "“所+ V”结构入门"\n    assert _ZH_SPACE.search(header["native_title"]) is None\n''', encoding='utf-8')
          PY
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_zh_header_metadata.py -q
      - name: Generation regressions
        run: python -m pytest grammar_lab/tests/test_generate.py grammar_lab/tests/test_validate_rules.py -q
      - name: Commit production patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git rm .github/workflows/final-bulk-salvage-patch.yml
          git add grammar_lab/pipeline/generate.py grammar_lab/tests/test_zh_header_metadata.py
          git commit -m "fix(grammar): normalize zh native title metadata"
          git push origin HEAD:feature/grammar-lab-pipeline
