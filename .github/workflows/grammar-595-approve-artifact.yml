name: Grammar 595 Approval Artifact

on:
  push:
    branches:
      - codex/grammar-595-review-local
    paths:
      - ".github/workflows/grammar-595-approve-artifact.yml"
  workflow_dispatch:

jobs:
  approve-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Apply reviewed deterministic repairs
        run: python grammar_lab/tools/final_ship_repairs.py
      - name: Preflight
        run: |
          python -m grammar_lab.pipeline.cli validate --lang en
          python -m grammar_lab.pipeline.cli validate --lang zh
          python -m pytest grammar_lab/tests
      - name: Approve canonical levels
        shell: bash
        run: |
          set -euo pipefail
          NOTE="Ship approval authorized by Thi after 595/595 deterministic validation; HSK1 semantic review completed; deep semantic review for remaining levels deferred to post-import QA."
          for level in A1 A2 B1 B2 C1 C2; do
            python -m grammar_lab.pipeline.cli approve --lang en --level "$level" --reviewer "Thi" --note "$NOTE"
          done
          for level in HSK1 HSK2 HSK3 HSK4 HSK5 HSK6 HSK7 HSK8 HSK9; do
            python -m grammar_lab.pipeline.cli approve --lang zh --level "$level" --reviewer "Thi" --note "$NOTE"
          done
      - name: Verify approved corpus
        run: |
          python -m grammar_lab.pipeline.cli validate --lang en
          python -m grammar_lab.pipeline.cli validate --lang zh
          python -m grammar_lab.pipeline.cli coverage --lang en
          python -m grammar_lab.pipeline.cli coverage --lang zh
          python -m grammar_lab.pipeline.cli export-profile
      - uses: actions/upload-artifact@v4
        with:
          name: grammar-595-approved-content
          path: |
            grammar_lab/content/en
            grammar_lab/content/zh
          retention-days: 7
