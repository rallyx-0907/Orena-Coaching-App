name: Grammar Free Cache Sweep Patch v2

on:
  push:
    paths:
      - '.github/workflows/cache-sweep-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm regression is red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_completion_agent_cache_sweep.py -q
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply patch
        run: python scripts/_tmp_cache_sweep_patch.py
      - name: Focused regression
        run: python -m pytest grammar_lab/tests/test_completion_agent_cache_sweep.py -q
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/grammar_completion_agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add scripts/grammar_completion_agent.ps1 grammar_lab/tests/test_completion_agent_cache_sweep.py
          git commit -m "fix(grammar): sweep free cache before paid candidates"
          git push origin HEAD:feature/grammar-lab-pipeline
