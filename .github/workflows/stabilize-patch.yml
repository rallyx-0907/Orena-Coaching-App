name: Stabilization Patch
on:
  push:
    paths:
      - '.github/workflows/stabilize-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm only CLI contract remains red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_stabilize.py -q
          status=$?
          set -e
          test "$status" -ne 0
      - name: Wire stabilize-corpus CLI
        shell: python
        run: |
          from pathlib import Path
          path = Path('grammar_lab/pipeline/cli.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from grammar_lab.pipeline.verify import VerifyFlag, VerifyReport, verify_point\n'
          addition = '''from grammar_lab.pipeline.stabilize import (\n    build_stabilization_report, render_stabilization_report, run_cache_sweep,\n    write_stabilization_report,\n)\n'''
          assert anchor in text and 'build_stabilization_report' not in text
          text = text.replace(anchor, anchor + addition, 1)

          command_anchor = '@app.command("generate-corpus")\n'
          command = r'''@app.command("stabilize-corpus")
def stabilize_corpus_command(
    lang: str = typer.Option(..., "--lang", help="en | zh."),
    skip_cache_sweep: bool = typer.Option(
        False, "--skip-cache-sweep",
        help="Audit the current corpus without replaying local cached completions first.",
    ),
    workers: int = typer.Option(4, "--workers", help="Parallel cache readers for the zero-provider cache sweep (1-16)."),
    as_json: bool = typer.Option(False, "--json", help="Print the stabilization report as JSON."),
    out: Path | None = typer.Option(None, "--out", help="Report JSON path; default .cache/stabilization/<lang>.json."),
    root: Path = typer.Option(LAB_ROOT, "--root"),
) -> None:
    """Salvage all usable cache once, then inventory the whole corpus and quality gates.

    This command never authorizes a provider call.  When cache sweep is enabled it invokes
    generate-corpus with --cache-only, --one-shot and --no-paid-repairs for every eligible
    point in one child process.  Invalid/missing candidates become report entries instead of
    stopping the corpus at the first point.
    """
    if lang not in ("en", "zh"):
        raise typer.BadParameter("expected en or zh", param_hint="--lang")
    if workers < 1 or workers > 16:
        raise typer.BadParameter("must be between 1 and 16", param_hint="--workers")

    outcomes: list[dict[str, str]] = []
    sweep_exit: int | None = None
    sweep_log = ""
    if not skip_cache_sweep:
        sweep_exit, sweep_log, outcomes = run_cache_sweep(lang, root, workers=workers)

    report = build_stabilization_report(lang, root, outcomes)
    report["cache_sweep"] = {
        "ran": not skip_cache_sweep,
        "exit_code": sweep_exit,
        "provider_calls_authorized": False,
    }

    report_path = out or (root / ".cache" / "stabilization" / f"{lang}.json")
    write_stabilization_report(report, report_path)
    if not skip_cache_sweep:
        log_path = report_path.with_suffix(".cache.log")
        log_path.parent.mkdir(parents=True, exist_ok=True)
        log_path.write_text(sweep_log, encoding="utf-8")
        report["cache_sweep"]["log"] = str(log_path)
        write_stabilization_report(report, report_path)

    if as_json:
        typer.echo(json.dumps(report, ensure_ascii=False, indent=2))
    else:
        typer.echo(render_stabilization_report(report))
        typer.echo(f"report: {report_path}")
    raise typer.Exit(0 if report["accepted"] else 1)


'''
          assert command_anchor in text and '@app.command("stabilize-corpus")' not in text
          text = text.replace(command_anchor, command + command_anchor, 1)
          path.write_text(text, encoding='utf-8')
      - name: Focused stabilization tests
        run: python -m pytest grammar_lab/tests/test_stabilize.py -q
      - name: CLI smoke (incomplete corpus must fail cleanly)
        shell: bash
        run: |
          set +e
          python -m grammar_lab.pipeline.cli stabilize-corpus --lang zh --skip-cache-sweep --json > /tmp/stabilize.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          data=json.load(open('/tmp/stabilize.json', encoding='utf-8'))
          assert data['lang']=='zh'
          assert data['accepted'] is False
          assert data['cache_sweep']['provider_calls_authorized'] is False
          PY
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Deterministic repository gates
        run: |
          python -m grammar_lab.pipeline.cli import-canonical --check
          python -m grammar_lab.pipeline.cli sync-metadata --check
          python -m grammar_lab.pipeline.cli seed-audit --lang all
          python -m grammar_lab.pipeline.cli corpus-plan --lang all
      - name: Commit verified CLI
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add grammar_lab/pipeline/cli.py
          git commit -m "feat(grammar): add corpus stabilization command"
          git push origin HEAD:feature/grammar-lab-pipeline
