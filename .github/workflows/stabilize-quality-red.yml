name: Stabilization Quality GREEN
on:
  push:
    paths:
      - '.github/workflows/stabilize-quality-red.yml'
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm repeated-prompt regression is GREEN
        run: python -m pytest grammar_lab/tests/test_stabilize.py -q
