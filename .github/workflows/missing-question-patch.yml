name: Grammar Missing Question Patch

on:
  push:
    paths:
      - '.github/workflows/missing-question-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Confirm regressions are red
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_missing_question_variant.py grammar_lab/tests/test_rescue_agent_contract.py -q
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply deterministic patch
        run: python scripts/_tmp_missing_question_patch.py
      - name: Focused regressions
        run: python -m pytest grammar_lab/tests/test_missing_question_variant.py grammar_lab/tests/test_rescue_agent_contract.py -q
      - name: Parse rescue PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/grammar_rescue_agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Targeted generation regressions
        run: python -m pytest grammar_lab/tests/test_generate.py -q
      - name: Full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add grammar_lab/pipeline/generate.py scripts/grammar_rescue_agent.ps1
          git commit -m "fix(grammar): recover proven missing zh question variant"
          git push origin HEAD:feature/grammar-lab-pipeline
