name: Repair Grammar 595 Test Assumptions

on:
  push:
    branches:
      - codex/grammar-595-audit-fix-full
    paths:
      - ".github/workflows/repair-grammar-595-tests.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"
      - name: Restore implemented question-word tests and update completed-corpus coverage expectation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/grammar-lab-pipeline --depth=1
          git checkout origin/feature/grammar-lab-pipeline -- grammar_lab/tests/test_question_word_structure.py
          python - <<'PY'
          from pathlib import Path
          p = Path("grammar_lab/tests/test_canonical_catalog.py")
          text = p.read_text(encoding="utf-8")
          old = '    assert zh["generated_total"] < zh["canonical_total"]\n'
          new = (
              '    assert 0 < zh["generated_total"] <= zh["canonical_total"]\n'
              '    assert zh["missing_content_total"] == zh["canonical_total"] - zh["generated_total"] == len(zh["missing_content"])\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale zh coverage assertion, found {text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Verify targeted tests
        run: python -m pytest grammar_lab/tests/test_canonical_catalog.py grammar_lab/tests/test_question_word_structure.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar_lab/tests/test_canonical_catalog.py grammar_lab/tests/test_question_word_structure.py
          git diff --cached --quiet && exit 0
          git commit -m "test: align grammar suite with complete 595 corpus"
          git push origin HEAD:codex/grammar-595-audit-fix-full
