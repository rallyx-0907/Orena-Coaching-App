name: Grammar Export Seed Repair

on:
  push:
    branches:
      - codex/fix-grammar-export-seed-metadata
    paths:
      - ".github/workflows/grammar-export-seed-repair.yml"

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-grammar-export-seed-metadata
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"

      - name: Normalize reviewed ZH seed titles
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("grammar_lab/inventory/seeds_zh.yaml")
          cjk = re.compile(r"[\u3400-\u9fff]")
          lines = path.read_text(encoding="utf-8").splitlines()
          out = []
          changed = []
          current_id = None

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("id:"):
                  current_id = stripped.split(":", 1)[1].strip().strip('"\'')
              if "native_title:" in line:
                  prefix, raw = line.split("native_title:", 1)
                  value = raw.strip()
                  if cjk.search(value) and " " in value:
                      normalized = value.replace(" ", "")
                      changed.append((current_id, value, normalized))
                      line = f"{prefix}native_title: {normalized}"
              out.append(line)

          if len(changed) < 17:
              raise SystemExit(f"expected at least 17 invalid reviewed titles, found {len(changed)}")
          for point_id, before, after in changed:
              print(f"normalized {point_id}: {before} -> {after}")
          path.write_text("\n".join(out) + "\n", encoding="utf-8", newline="\n")

      - name: Regenerate derived catalog
        run: python -m grammar_lab.pipeline.cli import-canonical --lang zh

      - name: Green regression and corpus validation
        run: |
          python -m pytest -q grammar_lab/tests/test_export_seed_metadata.py
          python -m grammar_lab.pipeline.cli validate --lang zh
          python -m grammar_lab.pipeline.cli coverage --lang zh

      - name: Commit and push source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar_lab/inventory/seeds_zh.yaml grammar_lab/inventory/catalog_zh.yaml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "fix(grammar): normalize reviewed ZH seed titles"
          git push origin HEAD:codex/fix-grammar-export-seed-metadata

      - name: Prove complete ZH production export
        shell: bash
        run: |
          set -euo pipefail
          ZH_IDS="$(python - <<'PY'
          import yaml
          from pathlib import Path
          rows = yaml.safe_load(Path('grammar_lab/inventory/catalog_zh.yaml').read_text(encoding='utf-8'))
          print(','.join(row['id'] for row in rows))
          PY
          )"
          rm -rf /tmp/grammar-export
          mkdir -p /tmp/grammar-export
          python -m grammar_lab.pipeline.cli export-package --lang zh --ids "$ZH_IDS" --out /tmp/grammar-export/zh-all --set-version 2026-10-08.zh.all --with-dropped --zip
          python -m grammar_lab.pipeline.cli validate-package /tmp/grammar-export/zh-all
