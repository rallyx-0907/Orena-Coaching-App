name: Grammar Export Seed Red

on:
  push:
    branches:
      - codex/fix-grammar-export-seed-metadata
    paths:
      - "grammar_lab/tests/test_export_seed_metadata.py"
      - ".github/workflows/grammar-export-seed-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "grammar_lab[dev]"
      - run: python -m pytest -q grammar_lab/tests/test_export_seed_metadata.py
