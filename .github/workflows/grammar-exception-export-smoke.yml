name: Grammar Exception Export Smoke
on:
  push:
    branches: [feature/grammar-lab-pipeline]
    paths:
      - 'scripts/export_grammar_exceptions.py'
      - '.github/workflows/grammar-exception-export-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/grammar-lab-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "grammar_lab[dev]"
      - run: python -m py_compile scripts/export_grammar_exceptions.py
      - run: python scripts/export_grammar_exceptions.py --help
      - name: Zero-exception smoke
        run: |
          printf '%s\n' '{"points":{}}' > /tmp/report.json
          python scripts/export_grammar_exceptions.py --lang zh --report /tmp/report.json --out /tmp/out.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/out.json', encoding='utf-8'))
          assert data['provider_calls_authorized'] is False
          assert data['exception_count'] == 0
          assert data['points'] == []
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git rm .github/workflows/grammar-exception-export-smoke.yml
          git commit -m "chore: remove exception exporter smoke workflow"
          git push origin HEAD:feature/grammar-lab-pipeline
