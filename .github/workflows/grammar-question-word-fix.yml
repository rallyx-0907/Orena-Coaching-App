name: Grammar Question Word Fix

on:
  push:

permissions:
  contents: write

jobs:
  fix-question-word:
    if: github.ref == 'refs/heads/feature/grammar-lab-pipeline' && !contains(github.event.head_commit.message, 'fix(grammar): normalize question-word position frame')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Grammar Lab dev dependencies
        run: python -m pip install -e "grammar_lab[dev]"

      - name: Add regression test
        shell: bash
        run: |
          cat > grammar_lab/tests/test_question_word_structure.py <<'PY'
          from __future__ import annotations

          import copy

          from grammar_lab.pipeline.generate import (
              assemble_generated_example,
              normalize_generated_question_word_frame,
              normalize_generated_structure,
          )


          def _slot(text: str, role: str, label: str) -> dict:
              return {"text": text, "role": role, "label": {"vi": label}, "optional": False, "options": []}


          def _candidate() -> dict:
              question = [
                  _slot("S", "subject", "chủ ngữ"),
                  _slot("V", "verb", "động từ"),
                  _slot("O", "object", "phần được hỏi"),
              ]
              return {
                  "formula": copy.deepcopy(question),
                  "negative": [],
                  "question": copy.deepcopy(question),
                  "examples": [
                      {
                          "form": "question", "text": "你喜欢什么？",
                          "bindings": [
                              {"slot_index": 0, "text": "你"},
                              {"slot_index": 1, "text": "喜欢"},
                              {"slot_index": 2, "text": "什么"},
                          ],
                      },
                      {
                          "form": "question", "text": "他找谁？",
                          "bindings": [
                              {"slot_index": 0, "text": "他"},
                              {"slot_index": 1, "text": "找"},
                              {"slot_index": 2, "text": "谁"},
                          ],
                      },
                      {
                          "form": "question", "text": "你在哪儿工作？",
                          "bindings": [
                              {"slot_index": 0, "text": "你"},
                              {"slot_index": 1, "text": "在哪儿工作"},
                              {"slot_index": 2, "text": "哪儿"},
                          ],
                      },
                  ],
                  "personal_production": {
                      "target_form": "question",
                      "pattern_rule": {
                          "ordered": True,
                          "slots": [{"slot_index": 2, "any_of": ["什么", "谁", "哪儿"], "regex": ""}],
                      },
                  },
              }


          def test_question_word_frame_repairs_locative_overlap_without_reinterpreting_as_object() -> None:
              data = _candidate()
              original = copy.deepcopy(data)
              out = normalize_generated_question_word_frame(data, True)

              assert data == original
              assert [slot["text"] for slot in out["question"]] == ["…", "疑问词", "…"]
              assert [slot["role"] for slot in out["question"]] == ["other", "other", "other"]
              assert [slot["optional"] for slot in out["question"]] == [True, False, True]
              assert out["examples"][0]["bindings"] == [
                  {"slot_index": 0, "text": "你喜欢"},
                  {"slot_index": 1, "text": "什么"},
              ]
              assert out["examples"][1]["bindings"] == [
                  {"slot_index": 0, "text": "他找"},
                  {"slot_index": 1, "text": "谁"},
              ]
              assert out["examples"][2]["bindings"] == [
                  {"slot_index": 0, "text": "你在"},
                  {"slot_index": 1, "text": "哪儿"},
                  {"slot_index": 2, "text": "工作"},
              ]
              assert out["personal_production"]["pattern_rule"]["slots"] == [
                  {"slot_index": 1, "any_of": ["什么", "谁", "哪儿"], "regex": ""}
              ]

              normalized = normalize_generated_structure(out, True)
              pattern = {"formula": normalized["formula"], "variants": {"question": normalized["question"]}}
              for index, example in enumerate(normalized["examples"]):
                  _assembled, problems = assemble_generated_example(
                      example, pattern, True, lambda value: value, index,
                  )
                  assert problems == []


          def test_question_word_frame_is_fail_closed_without_overlap_witness() -> None:
              data = _candidate()
              data["examples"][2]["bindings"][1]["text"] = "工作"
              assert normalize_generated_question_word_frame(data, True) == data


          def test_question_word_frame_is_fail_closed_for_non_question_production_rules() -> None:
              data = _candidate()
              data["personal_production"]["pattern_rule"]["slots"] = [
                  {"slot_index": 1, "any_of": ["喜欢", "找", "工作"], "regex": ""},
              ]
              assert normalize_generated_question_word_frame(data, True) == data
          PY

      - name: Confirm regression is red before patch
        shell: bash
        run: |
          set +e
          python -m pytest grammar_lab/tests/test_question_word_structure.py -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected regression test to fail before production patch."
            exit 1
          fi
          echo "RED confirmed."

      - name: Patch deterministic question-word repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("grammar_lab/pipeline/generate.py")
          text = path.read_text(encoding="utf-8")
          anchor = '\ndef normalize_generated_structure(data: dict[str, Any], zh: bool) -> dict[str, Any]:\n'
          assert anchor in text
          helper = r'''

_ZH_QUESTION_WORD_SURFACES = frozenset({
    "谁", "什么", "哪", "哪儿", "哪里", "几", "多少", "怎么", "怎么样", "为什么",
    "什么时候", "多久", "多长时间", "多大", "多高", "多远", "哪天", "哪年", "几点",
})


def _question_frame_label(example: Any, kind: str) -> Any:
    labels = {
        "before": {
            "vi": "phần đứng trước từ để hỏi",
            "en": "context before the question word",
            "zh-Hans": "疑问词前的成分",
        },
        "question": {
            "vi": "từ để hỏi ở đúng vị trí của phần cần hỏi",
            "en": "question word in the missing information's original position",
            "zh-Hans": "疑问词保留在原来的位置",
        },
        "after": {
            "vi": "phần đứng sau từ để hỏi",
            "en": "context after the question word",
            "zh-Hans": "疑问词后的成分",
        },
    }
    if isinstance(example, dict):
        return {locale: labels[kind].get(locale, labels[kind]["en"]) for locale in example}
    if isinstance(example, str):
        return labels[kind]["vi"]
    return labels[kind]["vi"]


def normalize_generated_question_word_frame(data: dict[str, Any], zh: bool) -> dict[str, Any]:
    """Repair the zh.question_words question variant into an in-place position frame.

    The point teaches that Chinese interrogative pronouns stay where the missing
    information belongs. A provider may instead force every question into an S-V-O
    analysis; locatives such as ``你在哪儿工作？`` then bind ``哪儿`` inside a larger
    verb binding (``在哪儿工作``), which cannot be made truthful by slot reordering.

    This repair is deliberately narrow: it only rewrites the question form when every
    example exposes exactly one recognised interrogative binding, at least one example
    proves a strict overlap with another binding, and personal-production rules (if any)
    constrain only interrogative literals. Ambiguous candidates remain unchanged.
    """
    out = copy.deepcopy(data)
    if not zh:
        return out
    formula = out.get("question") or []
    examples = [example for example in out.get("examples", []) if example.get("form") == "question"]
    if not formula or not examples:
        return out

    production = out.get("personal_production") or {}
    production_rule = production.get("pattern_rule") or {}
    production_slots = production_rule.get("slots") or [] if production.get("target_form") == "question" else []
    if production.get("target_form") == "question":
        for rule in production_slots:
            values = rule.get("any_of") or []
            if rule.get("regex") or not values or any(target_text(str(value), True) not in _ZH_QUESTION_WORD_SURFACES for value in values):
                return out

    records: list[tuple[dict[str, Any], str, str, str]] = []
    overlap_witness = False
    question_values: list[str] = []
    for example in examples:
        text = target_text(str(example.get("text", "")), True)
        bindings = example.get("bindings") or []
        question_bindings = [
            binding for binding in bindings
            if target_text(str(binding.get("text", "")), True) in _ZH_QUESTION_WORD_SURFACES
        ]
        if len(question_bindings) != 1:
            return out
        q_surface = target_text(str(question_bindings[0].get("text", "")), True)
        positions: list[int] = []
        start = text.find(q_surface)
        while start >= 0:
            positions.append(start)
            start = text.find(q_surface, start + 1)
        if len(positions) != 1:
            return out
        q_start = positions[0]
        q_end = q_start + len(q_surface)

        for binding in bindings:
            if binding is question_bindings[0]:
                continue
            surface = target_text(str(binding.get("text", "")), True)
            if not surface:
                continue
            starts: list[int] = []
            begin = text.find(surface)
            while begin >= 0:
                starts.append(begin)
                begin = text.find(surface, begin + 1)
            if len(starts) == 1:
                begin = starts[0]
                finish = begin + len(surface)
                if begin <= q_start and q_end <= finish and (begin < q_start or q_end < finish):
                    overlap_witness = True

        prefix = text[:q_start].strip()
        suffix = text[q_end:].strip().rstrip("？?。.!！").strip()
        if not prefix and not suffix:
            return out
        records.append((example, prefix, q_surface, suffix))
        if q_surface not in question_values:
            question_values.append(q_surface)

    if not overlap_witness:
        return out

    sample_label = formula[0].get("label") if formula else ""
    out["question"] = [
        {
            "text": "…", "role": "other", "label": _question_frame_label(sample_label, "before"),
            "optional": True, "options": [],
        },
        {
            "text": "疑问词", "role": "other", "label": _question_frame_label(sample_label, "question"),
            "optional": False, "options": [{"text": value} for value in question_values],
        },
        {
            "text": "…", "role": "other", "label": _question_frame_label(sample_label, "after"),
            "optional": True, "options": [],
        },
    ]

    for example, prefix, q_surface, suffix in records:
        rewritten: list[dict[str, Any]] = []
        if prefix:
            rewritten.append({"slot_index": 0, "text": prefix})
        rewritten.append({"slot_index": 1, "text": q_surface})
        if suffix:
            rewritten.append({"slot_index": 2, "text": suffix})
        example["bindings"] = rewritten

    if production.get("target_form") == "question":
        for rule in production_slots:
            rule["slot_index"] = 1
        production_rule["ordered"] = True

    return out
'''
          text = text.replace(anchor, helper + anchor, 1)

          old = '            data = normalize_generated_structure(result.data, zh)\n'
          new = '            candidate_data = normalize_generated_question_word_frame(result.data, zh) if point_id == "zh.question_words" else result.data\n            data = normalize_generated_structure(candidate_data, zh)\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '                structure_data = normalize_generated_structure(result.data, zh)\n'
          new = '                candidate_structure_data = normalize_generated_question_word_frame(result.data, zh) if point_id == "zh.question_words" else result.data\n                structure_data = normalize_generated_structure(candidate_structure_data, zh)\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run focused regression
        run: python -m pytest grammar_lab/tests/test_question_word_structure.py grammar_lab/tests/test_formula_order_consensus.py -q

      - name: Run targeted generation regressions
        run: python -m pytest grammar_lab/tests/test_generate.py -q -k 'generated_example_bindings or formula_order or nested'

      - name: Run full Grammar Lab suite
        run: python -m pytest grammar_lab/tests -q

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "CalisJI"
          git config user.email "78250571+CalisJI@users.noreply.github.com"
          git add grammar_lab/pipeline/generate.py grammar_lab/tests/test_question_word_structure.py
          git commit -m "fix(grammar): normalize question-word position frame"
          git push origin HEAD:feature/grammar-lab-pipeline
